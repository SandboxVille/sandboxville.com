<style>
:root{
  --ink-950:#05070d; --ink-900:#0a0e1a; --ink-800:#111629; --line:#2b3358;
  --paper:#eef0f6; --paper-dim:#c4c9e0; --paper-mute:#8991b7;
  --amber:#ffb347; --amber-strong:#ffa41f; --amber-soft:#ffd9a0;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--ink-900);color:var(--paper);
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;flex-direction:column;min-height:100svh;min-height:100vh;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
a{color:inherit;}
a:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px;}
.wrap{max-width:440px;margin:0 auto;padding:28px 20px;width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;gap:.85rem;}
.context{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);display:block;margin-bottom:.5rem;}
.wordmark{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.7rem;margin:0 0 .5rem;letter-spacing:-.01em;}
.wordmark span{color:var(--amber);}
.sub{color:var(--paper-dim);font-size:.94rem;line-height:1.55;margin:0 0 .5rem;max-width:36ch;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  padding:1.05rem 1.3rem;font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:700;
  letter-spacing:.02em;text-decoration:none;border:1px solid transparent;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);
}
.btn-primary{background:var(--amber);color:var(--ink-950);border-color:var(--amber);}
.btn-primary:hover{background:var(--amber-strong);}
.btn-ghost{background:transparent;color:var(--paper);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber-soft);}
.honest{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--paper-mute);letter-spacing:.02em;margin-top:.2rem;}
.foot{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--paper-mute);padding:0 20px 22px;}
.foot a{color:var(--paper-mute);text-decoration:underline;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380..700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
