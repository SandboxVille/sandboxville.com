<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Door not found - SandboxVille</title>
<meta name="description" content="This page does not exist. Head back to the SandboxVille town.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0e1a">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --ink-950:#05070d;
  --ink-900:#0a0e1a;
  --ink-800:#111629;
  --ink-700:#171d37;
  --line:#2b3358;
  --line-soft:#1c2340;
  --paper:#eef0f6;
  --paper-dim:#c4c9e0;
  --paper-mute:#8991b7;
  --amber:#ffb347;
  --amber-strong:#ffa41f;
  --amber-soft:#ffd9a0;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:radial-gradient(120% 90% at 50% 10%,#141b32 0%,var(--ink-900) 62%) var(--ink-900);
  color:var(--paper);
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
a{color:inherit;}
h1{margin:0;font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;}
p{margin:0;}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;width:100%;}
@media(min-width:900px){.wrap{padding:0 40px;}}
a:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px;}
.nav{border-bottom:1px solid var(--line);background:rgba(10,14,26,.86);}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding-top:14px;padding-bottom:14px;}
.wordmark{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;letter-spacing:.01em;text-decoration:none;color:var(--paper);}
.wordmark span{color:var(--amber);}
main{flex:1;display:flex;align-items:center;padding:4rem 0;}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:2.4rem;align-items:center;}
@media(min-width:760px){.grid{grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);}}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);display:inline-block;margin-bottom:.9rem;}
h1{font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.06;letter-spacing:-.01em;max-width:16ch;}
h1 em{color:var(--amber);font-style:normal;}
.body{margin-top:1.2rem;font-size:1.05rem;line-height:1.6;color:var(--paper-dim);max-width:44ch;}
.actions{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2rem;}
.btn{
  display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.6rem;
  font-family:'JetBrains Mono',monospace;font-size:.82rem;letter-spacing:.04em;text-decoration:none;
  border:1px solid transparent;white-space:nowrap;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);
}
.btn-primary{background:var(--amber);color:var(--ink-950);border-color:var(--amber);font-weight:700;}
.btn-primary:hover{background:var(--amber-strong);border-color:var(--amber-strong);}
.btn-ghost{background:transparent;color:var(--paper);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber-soft);}
.door-panel{position:relative;border:1px solid var(--line);background:var(--ink-950);padding:2rem 1.2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;max-width:320px;}
.door-panel svg{width:120px;height:150px;}
.door-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.1em;color:var(--amber-soft);text-align:center;line-height:1.6;}
.corner-tick{position:absolute;width:14px;height:14px;pointer-events:none;}
.corner-tick::before,.corner-tick::after{content:"";position:absolute;background:var(--amber);}
.corner-tick::before{width:100%;height:1px;top:0;left:0;}
.corner-tick::after{width:1px;height:100%;top:0;left:0;}
.corner-tick.tl{top:-1px;left:-1px;}
.corner-tick.tr{top:-1px;right:-1px;transform:scaleX(-1);}
.corner-tick.bl{bottom:-1px;left:-1px;transform:scaleY(-1);}
.corner-tick.br{bottom:-1px;right:-1px;transform:scale(-1,-1);}
footer{border-top:1px solid var(--line-soft);padding:1.6rem 0 2.2rem;}
footer p{font-size:.78rem;line-height:1.55;color:var(--paper-mute);max-width:92ch;}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380..700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-row">
      <a href="/" class="wordmark">SandboxVille<span>.</span></a>
    </div>
  </nav>

  <main>
    <div class="wrap grid">
      <div>
        <span class="eyebrow">404 &middot; Door not found</span>
        <h1>This door is <em>locked</em>,<br>or it was never built.</h1>
        <p class="body">Nothing lives at this address. The rest of the town is right where you left it.</p>
        <div class="actions">
          <a class="btn btn-primary" href="/">Back to the town &rarr;</a>
          <a class="btn btn-ghost" href="https://discord.gg/Dy3HPqawWh" target="_blank" rel="noopener noreferrer">Join the Discord</a>
        </div>
      </div>
      <div class="door-panel" aria-hidden="true">
        <div class="corner-tick tl"></div><div class="corner-tick tr"></div><div class="corner-tick bl"></div><div class="corner-tick br"></div>
        <svg viewBox="0 0 64 80" fill="none">
          <path d="M16 72V30a16 16 0 0 1 32 0V72Z" stroke="#ffb347" stroke-width="2"/>
          <path d="M22 50a10 11 0 0 1 20 0" stroke="#ffb347" stroke-width="2.4" transform="translate(0 -4)"/>
          <rect x="20" y="46" width="24" height="18" fill="#ffb347"/>
          <circle cx="32" cy="53" r="2.4" fill="#05070d"/>
          <rect x="31" y="54" width="2" height="5" fill="#05070d"/>
          <line x1="8" y1="72" x2="56" y2="72" stroke="#ffd9a0" stroke-width="2"/>
        </svg>
        <p class="door-label">CAN TOUCH: nothing.<br>THIS DOOR LEADS NOWHERE.</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <p>SandboxVille is an independent project.</p>
    </div>
  </footer>
</body>
</html>
